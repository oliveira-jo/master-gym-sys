<div class="modal-backdrop-custom">
  <div class="modal-container">
    <div class="modal-header">
      <h5>Registrar Pagamento</h5>
      <button type="button" class="btn-close" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form">
        <div class="mb-3">
          <label class="form-label">
            Valor Pago
          </label>
          <input class="form-control" type="number" formControlName="paymentAmount">
        </div>
        <div class="mb-3">
          <label class="form-label">
            Observação
          </label>
          <textarea rows="3" class="form-control" formControlName="observation">
          </textarea>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary me-2" (click)="cancel()">
        Cancelar
      </button>
      <button class="btn btn-success" (click)="save()">
        Confirmar Pagamento
      </button>
    </div>
  </div>
</div>
